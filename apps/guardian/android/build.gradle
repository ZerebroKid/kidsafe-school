buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        // Match ZKid's Kotlin so the Firebase SDKs (auth 23.2+) — compiled with Kotlin 2.x
        // metadata — link cleanly. AGP 8.6 + RN 0.76 both support Kotlin 2.0.
        kotlinVersion = "2.0.21"
        googlePlayServicesAuthVersion = "21.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        // Required so `apply plugin: "com.google.gms.google-services"` works in app/build.gradle
        // — without it Firebase auto-init never runs and `messaging()` throws
        // "No Firebase App '[DEFAULT]' has been created" the first time JS calls it.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

// Force every module (including transitive RN libs that pin no Kotlin version) onto our
// stdlib so RN's gradle plugin doesn't drag in Kotlin 1.9.x and clash with Firebase 2.x metadata.
allprojects {
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${rootProject.ext.kotlinVersion}"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${rootProject.ext.kotlinVersion}"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:${rootProject.ext.kotlinVersion}"
            force "org.jetbrains.kotlin:kotlin-reflect:${rootProject.ext.kotlinVersion}"
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
